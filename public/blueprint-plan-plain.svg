  <!-- Ground floor plan, 1:100, 1 unit = 10mm. No colour anywhere: this file is
       a CSS mask, so app/globals.css supplies the paint from the bp-plan token
       and the drawing re-tints with the brand. A fill here would break that.
       Note for editors: a double hyphen is illegal inside an XML comment, and a
       browser that rejects this document renders the mask as empty, which hides
       the layer completely rather than failing visibly. -->
  <style>
    rect, path, polygon, polyline, circle, ellipse, line { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: square; }
    .thin, .dim, .grid { fill: none; stroke: #000; stroke-width: 2; }
    .dim { stroke-width: 1.5; }
    .grid { stroke-width: 1.5; stroke-dasharray: 20 6 3 6; }
    .grid-bubble { fill: none; stroke: #000; stroke-width: 2; }
    text { fill: #000; font-family: monospace; letter-spacing: 1; }
    .room { font-weight: bold; letter-spacing: 2; }
  </style>
